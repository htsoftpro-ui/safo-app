name: Deploy All Dashboards to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['safo-supplier-dashboard/**', 'safo-admin-dashboard/**']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Supplier Dashboard
        working-directory: safo-supplier-dashboard
        run: |
          npm ci
          VITE_API_URL=https://safo-app.up.railway.app/api/v1 npm run build

      - name: Build Admin Dashboard
        working-directory: safo-admin-dashboard
        run: |
          npm ci
          VITE_API_URL=https://safo-app.up.railway.app/api/v1 npm run build

      - name: Combine sites
        run: |
          mkdir -p _site/supplier _site/admin
          cp -r safo-supplier-dashboard/dist/* _site/supplier/
          cp -r safo-admin-dashboard/dist/* _site/admin/
          echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>سافو</title></head><body style="font-family:sans-serif;text-align:center;padding:50px"><h1>🏪 سافو — منصة الجملة</h1><p><a href="supplier/">لوحة المورد</a></p><p><a href="admin/">لوحة الإدارة</a></p></body></html>' > _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
