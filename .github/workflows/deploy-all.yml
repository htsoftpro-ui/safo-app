name: Deploy Safo site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'market.html'
      - '.htaccess'
      - 'safo-customer-web/**'
      - 'safo-admin-dashboard/**'
      - 'safo-supplier-dashboard/**'
      - 'shaer-app/**'
      - '.github/workflows/deploy-all.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            safo-admin-dashboard/package-lock.json
            safo-supplier-dashboard/package-lock.json

      - name: Install Admin dependencies
        working-directory: safo-admin-dashboard
        run: npm ci

      - name: Build Admin Dashboard
        working-directory: safo-admin-dashboard
        run: npm run build

      - name: Install Supplier dependencies
        working-directory: safo-supplier-dashboard
        run: npm ci

      - name: Build Supplier Dashboard
        working-directory: safo-supplier-dashboard
        run: npm run build

      - name: Assemble one Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/admin _site/supplier _site/shaer-app

          # Safo customer market is the canonical root and explicit market.html entry.
          cp index.html _site/index.html
          cp market.html _site/market.html
          cp .htaccess _site/.htaccess

          # Keep the two dashboards under stable subpaths.
          cp -r safo-admin-dashboard/dist/. _site/admin/
          cp -r safo-supplier-dashboard/dist/. _site/supplier/
          cp -r shaer-app/. _site/shaer-app/

          # Direct pretty URLs should still open the hash-router route on static hosting.
          for route in login orders products profile; do
            mkdir -p "_site/supplier/$route"
            cat > "_site/supplier/$route/index.html" <<EOF
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-store"><title>سافو — لوحة المورد</title><script>location.replace('/safo-app/supplier/#/$route');</script></head><body>جارٍ فتح لوحة المورد…</body></html>
          EOF
          done

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
