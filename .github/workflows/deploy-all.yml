name: Deploy All Dashboards to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['safo-supplier-dashboard/**', 'safo-admin-dashboard/**', 'safo-customer-web/**']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build combined site
        run: |
          mkdir -p _site/supplier _site/admin
          cp safo-supplier-dashboard/dist/index.html _site/supplier/index.html
          cp safo-admin-dashboard/dist/index.html _site/admin/index.html
          cp safo-customer-web/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
