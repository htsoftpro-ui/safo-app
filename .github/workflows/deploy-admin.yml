name: Deploy Admin Dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['safo-admin-dashboard/**']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: safo-admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: safo-admin-dashboard
        run: npm ci

      - name: Build
        working-directory: safo-admin-dashboard
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: safo-admin-dashboard/dist

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
