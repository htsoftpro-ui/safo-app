name: Deploy Safo site to InfinityFree

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'market.html'
      - '.htaccess'
      - 'safo-customer-web/**'
      - 'safo-admin-dashboard/**'
      - 'safo-supplier-dashboard/**'
      - 'deploy/infinityfree/**'
      - 'scripts/deploy_ftp.py'
      - '.github/workflows/deploy-infinityfree.yml'

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            safo-admin-dashboard/package-lock.json
            safo-supplier-dashboard/package-lock.json

      - name: Install and build admin
        working-directory: safo-admin-dashboard
        run: npm ci && npm run build
        env:
          DEPLOY_TARGET: infinityfree

      - name: Install and build supplier
        working-directory: safo-supplier-dashboard
        run: npm ci && npm run build
        env:
          DEPLOY_TARGET: infinityfree

      - name: Assemble InfinityFree site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _infinityfree
          mkdir -p _infinityfree/admin _infinityfree/supplier
          cp index.html market.html .htaccess _infinityfree/
          cp -r safo-admin-dashboard/dist/. _infinityfree/admin/
          cp -r safo-supplier-dashboard/dist/. _infinityfree/supplier/
          cp -r deploy/infinityfree/supplier/. _infinityfree/supplier/
          touch _infinityfree/.nojekyll

      - name: Upload site over FTPS
        env:
          FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.INFINITYFREE_FTP_REMOTE_DIR || 'htdocs' }}
        run: python3 scripts/deploy_ftp.py _infinityfree
