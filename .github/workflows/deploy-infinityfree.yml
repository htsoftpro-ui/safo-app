name: Deploy Safo market and role surfaces to InfinityFree

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-market-production
  cancel-in-progress: true

jobs:
  deploy-market:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
      FTP_USER: ${{ secrets.INFINITYFREE_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.INFINITYFREE_FTP_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare market and role package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _infinityfree_market
          mkdir -p _infinityfree_market/supplier
          cp index.php index.html market.html .htaccess _infinityfree_market/
          DEPLOY_TARGET=infinityfree pnpm --dir safo-supplier-dashboard install --frozen-lockfile=false
          DEPLOY_TARGET=infinityfree pnpm --dir safo-supplier-dashboard build
          cp -R safo-supplier-dashboard/dist/. _infinityfree_market/supplier/

      - name: Upload market and role package over FTPS
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASSWORD != '' }}
        run: python3 scripts/deploy_ftp.py _infinityfree_market

      - name: Explain missing deployment secrets
        if: ${{ env.FTP_HOST == '' || env.FTP_USER == '' || env.FTP_PASSWORD == '' }}
        run: echo 'InfinityFree deployment skipped because repository Actions secrets are not configured.'
