name: CI — Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safo-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql, bcmath, gd, intl, redis
          coverage: none

      - name: Copy .env
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=mysql/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=root/' .env
          sed -i 's/DB_DATABASE=safo/DB_DATABASE=safo_test/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=file/' .env
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=file/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env

      - name: Install Dependencies
        run: composer install --no-progress --no-interaction

      - name: Generate Key
        run: php artisan key:generate --force

      - name: Publish Sanctum Migrations
        run: php artisan vendor:publish --provider="Laravel\Sanctum\SanctumServiceProvider"

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test --parallel

      - name: Validate Routes
        run: |
          ROUTE_COUNT=$(php artisan route:list --columns=method,uri | grep -c "api/")
          echo "API Routes: $ROUTE_COUNT"

      - name: Validate Migrations
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force
          echo "✅ Migrations and seeders OK"
