name: CI — Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safo-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, gd, intl
          coverage: none

      - name: Copy .env
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_HOST=mysql/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=safo/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=file/' .env
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=file/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-progress --no-interaction

      - name: Generate Key
        run: php artisan key:generate --force

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Seeders
        run: php artisan db:seed --force

      - name: Run Tests
        run: php artisan test --verbose

      - name: Validate Migrations
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force
          echo "Migrations and seeders OK"
